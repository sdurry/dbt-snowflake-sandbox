version: 2

models:
  - name: dim_date
    description: Date dimension covering each calendar date from 2015-01-01 through the end of next year, with derived calendar attributes for reporting and time-based analysis.
    columns:
      - name: date_dwid
        description: Surrogate date key in YYYYMMDD integer format.
        data_tests:
          - unique
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^[0-9]{8}$'

      - name: date
        description: Calendar date.
        data_tests:
          - unique
          - not_null

      - name: year
        description: Calendar year.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 2015

      - name: quarter
        description: Calendar quarter number.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 4

      - name: month
        description: Calendar month number.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 12

      - name: week
        description: ISO week number.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 53

      - name: day
        description: Day of month.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 31

      - name: year_quarter
        description: Calendar year and quarter in YYYY-QN format.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^[0-9]{4}-Q[1-4]$'

      - name: year_month
        description: Calendar year and month in YYYY-MMM format.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^[0-9]{4}-M(0[1-9]|1[0-2])$'

      - name: year_week
        description: ISO year and week in YYYY-WWW format.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$'

      - name: year_month_short
        description: Calendar year and month in YYYYMM integer format.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^[0-9]{6}$'

      - name: year_week_short
        description: ISO year and week in YYYYWw integer-like format.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^[0-9]{6}$'

      - name: name_month
        description: Calendar month name.
        data_tests:
          - not_null

      - name: name_day
        description: Day name.
        data_tests:
          - not_null

      - name: day_of_year
        description: Day number within the year.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 366

      - name: day_of_month
        description: Day number within the month.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 31

      - name: day_of_week
        description: ISO day of week where Monday is 1 and Sunday is 7.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]

      - name: last_day_of_year
        description: Last calendar day of the year for the row date.
        data_tests:
          - not_null

      - name: last_day_of_quarter
        description: Last calendar day of the quarter for the row date.
        data_tests:
          - not_null

      - name: last_day_of_month
        description: Last calendar day of the month for the row date.
        data_tests:
          - not_null

      - name: last_day_of_week
        description: Last calendar day of the ISO week for the row date.
        data_tests:
          - not_null

      - name: is_future
        description: Flag indicating whether the date is after the current date.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "date = to_date(to_varchar(date_dwid), 'YYYYMMDD')"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "quarter(date) = quarter"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "month(date) = month"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "day(date) = day"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dayofyear(date) = day_of_year"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dayofmonth(date) = day_of_month"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dayofweekiso(date) = day_of_week"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "last_day(date, 'YEAR') = last_day_of_year"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "last_day(date, 'QUARTER') = last_day_of_quarter"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "last_day(date) = last_day_of_month"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "last_day(date, 'WEEK') = last_day_of_week"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "iff(date > current_date(), 1, 0) = is_future"
