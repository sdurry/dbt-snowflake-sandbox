saved_queries:
  - name: monthly_orders_by_region
    description: Monthly order count and distinct customer count split by region and nation
    label: Monthly Orders by Region and Nation
    query_params:
      metrics:
        - order_count
        - customer_count
      group_by:
        - "TimeDimension('metric_time', 'month')"
        - "Dimension('customer__region')"
        - "Dimension('customer__nation')"
    exports:
      - name: monthly_orders_by_region
        config:
          export_as: table