version: 2

models:
  # These two models are just different ways of doing the same thing (pivot over categories) using jinja and the PIVOT operation in Snowflake
  - name: agg_ship_modes_hardcoded_pivot
    description: Example of creating a pivot table with dynamic columns based on the ship modes that are in the system
    columns:
      - name: order_year
        description: year of the order

      - name: "'AIR'"
        description: ''
        data_type: NUMBER
      - name: "'REG AIR'"
        description: ''
        data_type: NUMBER
      - name: "'FOB'"
        description: ''
        data_type: NUMBER
      - name: "'RAIL'"
        description: ''
        data_type: NUMBER
      - name: "'MAIL'"
        description: ''
        data_type: NUMBER
      - name: "'SHIP'"
        description: ''
        data_type: NUMBER
      - name: "'TRUCK'"
        description: ''
        data_type: NUMBER
  - name: agg_ship_modes_dynamic_pivot
    description: Example of creating a pivot table with hard-coded columns based on a query of the ship modes that are in the system
    columns:
      - name: order_year
        description: year of the order
      - name: AIR_AMOUNT
        description: ''
        data_type: NUMBER
      - name: FOB_AMOUNT
        description: ''
        data_type: NUMBER
      - name: REG_AIR_AMOUNT
        description: ''
        data_type: NUMBER
      - name: SHIP_AMOUNT
        description: ''
        data_type: NUMBER
      - name: TRUCK_AMOUNT
        description: ''
        data_type: NUMBER
      - name: MAIL_AMOUNT
        description: ''
        data_type: NUMBER
      - name: RAIL_AMOUNT
        description: ''
        data_type: NUMBER
