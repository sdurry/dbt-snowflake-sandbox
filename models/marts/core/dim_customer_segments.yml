version: 2

models:
  - name: dim_customer_segments
    description: >
      Assigns each customer a lifetime value (LTV) segment based on their total
      net sales across all orders. Segments are derived from percentile thresholds
      computed across the full customer population:
        - bronze: at or below the 25th percentile
        - gold: at or above the 90th percentile
        - silver: everything in between
    columns:
      - name: customer_key
        description: Primary key — foreign key to dim_customers
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: lifetime_value
        description: Sum of net_item_sales_amount across all orders for the customer
        data_tests:
          - not_null
      - name: customer_segment
        description: LTV tier assigned to the customer — bronze, silver, or gold
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["bronze", "silver", "gold"]

unit_tests:
  - name: test_customer_segment_assignment
    description: >
      Validates bronze/silver/gold assignment based on lifetime value percentiles.
      With LTVs [100, 500, 700, 1000]:
        p25 = 400.0 (PERCENTILE_CONT(0.25))
        p90 = 910.0 (PERCENTILE_CONT(0.90))
      Expected: 100 → bronze, 500 → silver, 700 → silver, 1000 → gold
    model: dim_customer_segments
    given:
      - input: ref('fct_orders')
        rows:
          - {order_key: 1, customer_key: 1, net_item_sales_amount: 60}
          - {order_key: 2, customer_key: 1, net_item_sales_amount: 40}
          - {order_key: 3, customer_key: 2, net_item_sales_amount: 500}
          - {order_key: 4, customer_key: 3, net_item_sales_amount: 300}
          - {order_key: 5, customer_key: 3, net_item_sales_amount: 400}
          - {order_key: 6, customer_key: 4, net_item_sales_amount: 1000}
    expect:
      rows:
        - {customer_key: 1, lifetime_value: 100, customer_segment: "bronze"}
        - {customer_key: 2, lifetime_value: 500, customer_segment: "silver"}
        - {customer_key: 3, lifetime_value: 700, customer_segment: "silver"}
        - {customer_key: 4, lifetime_value: 1000, customer_segment: "gold"}