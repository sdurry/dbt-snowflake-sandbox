version: 2

models:
  - name: fct_orders
    description: orders fact table
    semantic_model:
      enabled: true
    agg_time_dimension: order_date
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.recency:
          arguments:
            field: order_date
            datepart: day
            interval: 12
      - dbt_expectations.expect_multicolumn_sum_to_equal:
          arguments:
            column_list:
              - gross_item_sales_amount
              - item_discount_amount
              - item_tax_amount
            sum_total: net_item_sales_amount
    columns:
      - name: order_key
        description: primary key of the model
        data_type: number(38,0)
        entity:
          type: primary
          name: sales_order
        constraints:
          - type: not_null
        data_tests:
          - unique
          - not_null

      - name: order_date
        description: date of the order
        data_type: date
        granularity: day
        dimension:
          type: time
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: customer_key
        description: foreign key for customers
        data_type: number(38,0)
        entity:
          type: foreign
          name: customer
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key

      - name: status_code
        description: status of the order
        data_type: varchar(1)
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              config:
                severity: warn
              arguments:
                values:
                  - "F"
                  - "O"
                  - "P"

      - name: priority_code
        description: code associated with the order
        data_type: varchar(20)
        dimension:
          type: categorical

      - name: clerk_name
        description: id of the clerk
        data_type: varchar(40)

      - name: ship_priority
        description: numeric representation of the shipping priority, zero being the default
        data_type: int

      - name: order_count
        description: count of order
        data_type: number(1,0)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1]

      - name: gross_item_sales_amount
        description: '{{ doc("gross_item_sales_amount") }}'
        data_type: number(38,0)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

      - name: item_discount_amount
        description: '{{ doc("item_discount_amount") }}'
        data_type: number(28,2)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                max_value: 0

      - name: item_tax_amount
        description: '{{ doc("item_tax_amount") }}'
        data_type: number(28,2)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

      - name: net_item_sales_amount
        description: '{{ doc("net_item_sales_amount") }}'
        data_type: number(28,2)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

    metrics:
      - name: order_count
        type: simple
        label: Order Count
        agg: count
        expr: order_key
      - name: gross_item_sales_amount
        type: simple
        label: Gross Item Sales Amount
        agg: sum
        expr: gross_item_sales_amount
      - name: net_item_sales_amount
        type: simple
        label: Net Item Sales Amount
        agg: sum
        expr: net_item_sales_amount
      - name: item_discount_amount
        type: simple
        label: Item Discount Amount
        agg: sum
        expr: item_discount_amount
      - name: item_tax_amount
        type: simple
        label: Item Tax Amount
        agg: sum
        expr: item_tax_amount
