models:
  - name: loyaltyy
    description: This model calculates the loyalty status of customers based on their total spending. Customers are assigned a medallion level (gold, silver, bronze) and awarded points based on their purchase history.
    columns:
      - name: customer_key
        description: A unique identifier for each customer.
        tests:
          - unique
          - not_null
      - name: medallion_level
        description: The loyalty status of the customer, classified as 'gold', 'silver', or 'bronze' based on total spending.
        tests:
          - accepted_values:
              values: ['gold', 'silver', 'bronze']
      - name: points_amount
        description: The number of loyalty points awarded to the customer, rounded to the nearest ten thousand dollars of total spending.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000
              strictly: false # Adds an 'or equal to' to the comparison operator for min/max