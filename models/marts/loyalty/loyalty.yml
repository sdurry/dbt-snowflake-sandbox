version: 2

models:
  - name: loyalty_points
    description: client loyalty program with gold, silver, bronze status
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - customer_key
        name: PK_1
      - type: foreign_key
        columns:
          - customer_key
        expression: "{{ target.schema }}.dim_customers(customer_key)"
    columns:
      - name: customer_key
        data_type: number(38,0)
        description: customer id from customer dimension       
        constraints:
          - type: not_null
      - name: medallion_level
        data_type: varchar(10)
        description: 'loyalty tier: bronze, silver, or gold'
        constraints:
          - type: not_null
        tests:
          - accepted_values:
              values: ['bronze', 'silver', 'gold']
      - name: points_amount
        data_type: integer
        description: total points accumulated (total sales volume in USD / 10000)
        constraints:
          - type: not_null
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 10000
              inclusive: false
