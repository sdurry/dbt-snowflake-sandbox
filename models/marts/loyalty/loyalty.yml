version: 2

groups:
  - name: marketing
    owner:
      # 'name' or 'email' is required; additional properties allowed
      name: Marketing 
      email: marketing@ddvug.com

models:
  - name: loyalty_points
    description: client loyalty program with gold, silver, bronze status
    group: marketing
    config:
      meta:
        steward: "Oliver Cramer"
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - customer_key
        name: PK_1
      - type: foreign_key
        columns:
          - customer_key
        expression: "{{ target.schema }}.dim_customers(customer_key)"
    columns:
      - name: customer_key
        data_type: number(38,0)
        description: customer id from customer dimension       
        constraints:
          - type: not_null
      - name: medallion_level
        data_type: varchar(10)
        description: 'loyalty tier: bronze, silver, or gold'
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              values: ['bronze', 'silver', 'gold']
      - name: points_amount
        data_type: integer
        description: total points accumulated (total sales volume in USD / 10000)
        constraints:
          - type: not_null
