models:
  - name: loyalty
    description: This model calculates the loyalty tier (medallion level) and points for each customer based on their total purchase amount in USD.
    columns:
      - name: customer_key
        description: Unique identifier for each customer.
        tests:
          - unique
          - not_null
      - name: medallion_level
        description: Loyalty tier assigned to the customer based on their total purchase amount. Possible values are 'gold', 'silver', and 'bronze'.
        tests:
          - accepted_values:
              values: ['gold', 'silver', 'bronze']
      - name: points_amount
        description: Points accumulated by the customer, calculated as total purchase amount in USD divided by 10,000 and rounded.
        tests:
          - not_null