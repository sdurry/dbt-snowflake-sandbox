models:
  - name: loyalty
    description: This model categorizes customers based on their total spending and calculates their loyalty points. It assigns a medallion level (gold, silver, bronze) based on the total amount spent and calculates a points amount.
    columns:
      - name: customer_key
        description: The unique identifier for the customer.
        tests:
          - unique
          - not_null

      - name: medallion_level
        description: The loyalty tier assigned to the customer based on total spending. Possible values are 'gold', 'silver', and 'bronze'.
        tests:
          - accepted_values:
              values: ['gold', 'silver', 'bronze']

      - name: points_amount
        description: The number of loyalty points awarded to the customer, calculated as total spending divided by 10,000 rounded to the nearest whole number.
        tests:
          - not_null