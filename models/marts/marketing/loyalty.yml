models:
  - name: loyalty
    description: This model categorizes customers into medallion levels based on their total spending and calculates loyalty points.
    columns:
      - name: customer_key
        description: A unique identifier for each customer.
        tests:
          - unique
          - not_null
      - name: medallion_level
        description: The loyalty tier assigned to a customer based on their total spending (gold, silver, or bronze).
        tests:
          - accepted_values:
              values: ['gold', 'silver', 'bronze']
      - name: points_amount
        description: The number of loyalty points a customer has accumulated, calculated as total spending divided by 10,000 and rounded.
        tests:
          - not_null