models:
- name: customer_loyalty
  description: This model categorizes customers into loyalty tiers based on their
    total purchase amount and calculates loyalty points. It helps in identifying high-value
    customers and tailoring marketing strategies accordingly.
  columns:
  - name: customer_key
    description: A unique identifier for each customer.
    data_tests:
      - unique
      - not_null
  - name: medallion_level
    description: The loyalty tier assigned to a customer based on their total purchase
      amount, categorized as gold, silver, or bronze.
    data_tests:
      - accepted_values:
          values: ['gold', 'silver', 'bronze']
  - name: points_amount
    description: The number of loyalty points a customer has earned, calculated based
      on their total purchase amount.
    data_tests:
      - not_null
      - dbt_expectations.expect_column_values_to_be_between:
          min_value: 0
          max_value: 1000
          strictly: false # Adds an 'or equal to' to the comparison operator for min/max
