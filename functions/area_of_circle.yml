functions:
  - name: area_of_circle        # required
    description: Calculates the area of a circle given its radius.
    arguments:                  # optional
      - name: radius            # required if arguments is specified
        data_type: float       # required if arguments is specified
        description: Radius of the circle
        default_value: "1.00"      # optional, available in Snowflake and Postgres
    returns:                    # required
      data_type: float   
