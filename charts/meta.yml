# Shared defaults for every board under charts/ — a *partial board* with no
# layout of its own. `dashboard.yml` and each per-chart preview file below
# inherit this source, variable, and every query/chart defined here. Edit a
# query or chart here and every board that renders it picks up the change.

source: analytics

variables:
  region:
    input: select
    label: "Region"
    notes: "Restricts the KPI row, trend chart, and country map. region_split stays unfiltered as the all-regions baseline."
    options:
      static: [All, AFRICA, AMERICA, ASIA, EUROPE, MIDDLE EAST]
    default: All

  tile_token:
    input: text
    visible: false
    default: ""
    notes: >
      Read-only dbt Catalog metadata-service token for the exposure-status
      link in dashboard.yml. Deliberately left blank here -- this file is
      committed to git. Supply the real value only at render/serve time
      (dct serve, then open /dashboard/?tile_token=<token>; or dct render
      --var tile_token=<token>), never as this default. See AGENTS.md
      ("Linking charts back to semantic definitions").

  time_range:
    input: select
    label: "Time Range"
    notes: "Restricts the KPI row, trend chart, and country map to a rolling window ending at the most recent order date (not wall-clock today — this is static historical data). region_split stays unfiltered as the all-time baseline, same convention as the region filter. The Net Sales KPI's trend indicator is also an exception: it always compares trailing/prior 12 months regardless of this selector."
    options:
      static: ["Last 12 Months", "Last 24 Months", "Last 36 Months", "All Time"]
    default: "Last 24 Months"

queries:
  order_kpis:
    notes: >
      Single-row headline for the KPI row — net sales, order count, average
      order value, filtered by region and time range — plus trailing/prior
      12-month net sales and order counts (region-filtered only, independent
      of time_range) and their pct change, powering the Net Sales and Orders
      KPIs' trend indicators.
    sql: |
      WITH agg AS (
        SELECT
          SUM(o.net_item_sales_amount) AS net_sales,
          COUNT(*) AS order_count,
          SUM(o.net_item_sales_amount) / COUNT(*) AS avg_order_value,
          (
            SELECT SUM(o2.net_item_sales_amount)
            FROM fct_orders o2
            JOIN dim_customers c2 ON o2.customer_key = c2.customer_key
            WHERE o2.order_date >= DATEADD('month', -12, (SELECT MAX(order_date) FROM fct_orders))
            {% if region and region != 'All' %}
              AND {{ filter('c2.region', region) }}
            {% endif %}
          ) AS trailing_12mo_net_sales,
          (
            SELECT SUM(o3.net_item_sales_amount)
            FROM fct_orders o3
            JOIN dim_customers c3 ON o3.customer_key = c3.customer_key
            WHERE o3.order_date < DATEADD('month', -12, (SELECT MAX(order_date) FROM fct_orders))
              AND o3.order_date >= DATEADD('month', -24, (SELECT MAX(order_date) FROM fct_orders))
            {% if region and region != 'All' %}
              AND {{ filter('c3.region', region) }}
            {% endif %}
          ) AS prior_12mo_net_sales,
          (
            SELECT COUNT(*)
            FROM fct_orders o4
            JOIN dim_customers c4 ON o4.customer_key = c4.customer_key
            WHERE o4.order_date >= DATEADD('month', -12, (SELECT MAX(order_date) FROM fct_orders))
            {% if region and region != 'All' %}
              AND {{ filter('c4.region', region) }}
            {% endif %}
          ) AS trailing_12mo_order_count,
          (
            SELECT COUNT(*)
            FROM fct_orders o5
            JOIN dim_customers c5 ON o5.customer_key = c5.customer_key
            WHERE o5.order_date < DATEADD('month', -12, (SELECT MAX(order_date) FROM fct_orders))
              AND o5.order_date >= DATEADD('month', -24, (SELECT MAX(order_date) FROM fct_orders))
            {% if region and region != 'All' %}
              AND {{ filter('c5.region', region) }}
            {% endif %}
          ) AS prior_12mo_order_count
        FROM fct_orders o
        JOIN dim_customers c ON o.customer_key = c.customer_key
        WHERE 1=1
        {% if region and region != 'All' %}
          AND {{ filter('c.region', region) }}
        {% endif %}
        {% if time_range and time_range != 'All Time' %}
          AND o.order_date >= (
            SELECT CASE {{ time_range }}
              WHEN 'Last 12 Months' THEN DATEADD('month', -12, MAX(order_date))
              WHEN 'Last 24 Months' THEN DATEADD('month', -24, MAX(order_date))
              WHEN 'Last 36 Months' THEN DATEADD('month', -36, MAX(order_date))
            END
            FROM fct_orders
          )
        {% endif %}
      )
      SELECT
        *,
        trailing_12mo_net_sales / NULLIF(prior_12mo_net_sales, 0) - 1 AS net_sales_trend_pct,
        trailing_12mo_order_count / NULLIF(prior_12mo_order_count, 0) - 1 AS order_count_trend_pct
      FROM agg

  monthly_status_breakdown:
    notes: Net sales by order month, broken down by order status — the trend series, filtered by region and time range.
    sql: |
      SELECT
        DATE_TRUNC('month', o.order_date) AS month,
        CASE o.status_code
          WHEN 'F' THEN 'Fulfilled'
          WHEN 'O' THEN 'Open'
          WHEN 'P' THEN 'Pending'
          ELSE o.status_code
        END AS status,
        SUM(o.net_item_sales_amount) AS net_sales
      FROM fct_orders o
      JOIN dim_customers c ON o.customer_key = c.customer_key
      WHERE 1=1
      {% if region and region != 'All' %}
        AND {{ filter('c.region', region) }}
      {% endif %}
      {% if time_range and time_range != 'All Time' %}
        AND o.order_date >= (
          SELECT CASE {{ time_range }}
            WHEN 'Last 12 Months' THEN DATEADD('month', -12, MAX(order_date))
            WHEN 'Last 24 Months' THEN DATEADD('month', -24, MAX(order_date))
            WHEN 'Last 36 Months' THEN DATEADD('month', -36, MAX(order_date))
          END
          FROM fct_orders
        )
      {% endif %}
      GROUP BY 1, 2
      ORDER BY 1, 2

  region_breakdown:
    notes: Net sales and order count by customer region — deliberately unfiltered, the all-regions, all-time comparison view.
    ignore: [WARN-FANOUT-RISK]  # verified: dim_customers.customer_key is unique, join is order:customer N:1
    sql: |
      SELECT
        c.region AS region,
        COUNT(*) AS order_count,
        SUM(o.net_item_sales_amount) AS net_sales
      FROM fct_orders o
      JOIN dim_customers c ON o.customer_key = c.customer_key
      GROUP BY 1
      ORDER BY 1

  country_breakdown:
    notes: >
      Net sales by customer nation (TPC-H's finest geographic grain),
      filtered by region and time range like the KPI row and trend chart.
      country_code maps each nation to its ISO-3166-1 numeric code, which is
      the join key the world-countries/world-50m map geo sources expect
      (numeric TopoJSON ids, not ISO alpha codes -- see dct docs maps).
      sales_quantile buckets countries into 5 net-sales quintiles (NTILE)
      and sales_quantile_label carries each bucket's real dollar range --
      the map colors by this categorical label rather than a continuous
      scale, since dbt charts has no log-scale option for a choropleth's
      color and a continuous scale washes out this evenly-distributed data.
    ignore: [WARN-FANOUT-RISK]  # verified: dim_customers.customer_key is unique, join is order:customer N:1
    sql: |
      WITH base AS (
        SELECT
          c.nation AS nation,
          CASE c.nation
            WHEN 'ALGERIA' THEN 12
            WHEN 'ARGENTINA' THEN 32
            WHEN 'BRAZIL' THEN 76
            WHEN 'CANADA' THEN 124
            WHEN 'CHINA' THEN 156
            WHEN 'EGYPT' THEN 818
            WHEN 'ETHIOPIA' THEN 231
            WHEN 'FRANCE' THEN 250
            WHEN 'GERMANY' THEN 276
            WHEN 'INDIA' THEN 356
            WHEN 'INDONESIA' THEN 360
            WHEN 'IRAN' THEN 364
            WHEN 'IRAQ' THEN 368
            WHEN 'JAPAN' THEN 392
            WHEN 'JORDAN' THEN 400
            WHEN 'KENYA' THEN 404
            WHEN 'MOROCCO' THEN 504
            WHEN 'MOZAMBIQUE' THEN 508
            WHEN 'PERU' THEN 604
            WHEN 'ROMANIA' THEN 642
            WHEN 'RUSSIA' THEN 643
            WHEN 'SAUDI ARABIA' THEN 682
            WHEN 'UNITED KINGDOM' THEN 826
            WHEN 'UNITED STATES' THEN 840
            WHEN 'VIETNAM' THEN 704
          END AS country_code,
          SUM(o.net_item_sales_amount) AS net_sales
        FROM fct_orders o
        JOIN dim_customers c ON o.customer_key = c.customer_key
        WHERE 1=1
        {% if region and region != 'All' %}
          AND {{ filter('c.region', region) }}
        {% endif %}
        {% if time_range and time_range != 'All Time' %}
          AND o.order_date >= (
            SELECT CASE {{ time_range }}
              WHEN 'Last 12 Months' THEN DATEADD('month', -12, MAX(order_date))
              WHEN 'Last 24 Months' THEN DATEADD('month', -24, MAX(order_date))
              WHEN 'Last 36 Months' THEN DATEADD('month', -36, MAX(order_date))
            END
            FROM fct_orders
          )
        {% endif %}
        GROUP BY 1, 2
      ),
      bucketed AS (
        SELECT
          *,
          NTILE(5) OVER (ORDER BY net_sales) AS sales_quantile
        FROM base
      ),
      bucket_ranges AS (
        SELECT
          sales_quantile,
          MIN(net_sales) AS bucket_min,
          MAX(net_sales) AS bucket_max
        FROM bucketed
        GROUP BY 1
      )
      SELECT
        b.nation,
        b.country_code,
        b.net_sales,
        b.sales_quantile,
        'Q' || b.sales_quantile || ': $' || TO_VARCHAR(ROUND(r.bucket_min / 1000000, 1)) || 'M–$' || TO_VARCHAR(ROUND(r.bucket_max / 1000000, 1)) || 'M' AS sales_quantile_label
      FROM bucketed b
      JOIN bucket_ranges r ON b.sales_quantile = r.sales_quantile
      ORDER BY b.sales_quantile, b.nation

charts:
  revenue_kpi:
    type: kpi
    query: order_kpis
    label: Net Sales
    value: net_sales
    notes: >
      Headline net sales for the selected region, with a trend indicator
      comparing trailing 12 months to the prior 12 months (region-filtered
      only — independent of the time_range selector).
    link: &net_item_sales_amount_link "https://pp569.eu1.dbt.com/explore/180/projects/3588/environments/staging/details/metric.stephans_snow_sandbox.net_item_sales_amount"
    style:
      value:
        format: currency
    support:
      # net_sales_trend_pct's own sign carries the direction (percent_delta
      # always signs its output). tone is static (can't flip red/green by
      # the query result -- conditional_formatting on a KPI only paints the
      # headline `value`, not `support.value`, confirmed by render), so
      # `info` is used purely to lift this line's contrast on the dark
      # theme rather than to claim a positive/negative judgment.
      value: net_sales_trend_pct
      label: "vs. prior 12 months"
      format: percent_delta
      tone: info

  orders_kpi:
    type: kpi
    query: order_kpis
    label: Orders
    value: order_count
    notes: >
      Headline order count for the selected region, with a trend indicator
      comparing trailing 12 months to the prior 12 months (region-filtered
      only — independent of the time_range selector).
    link: &order_count_link "https://pp569.eu1.dbt.com/explore/180/projects/3588/environments/staging/details/metric.stephans_snow_sandbox.order_count"
    support:
      value: order_count_trend_pct
      label: "vs. prior 12 months"
      format: percent_delta
      tone: info

  aov_kpi:
    type: kpi
    query: order_kpis
    label: Avg Order Value
    value: avg_order_value
    notes: >
      Net sales divided by order count for the selected region. No standalone
      metric is declared for this ratio in fct_orders.yml yet, so there's
      nothing to link to — see the aov_kpi entry in charts/semantic_links.yml.
    style:
      value:
        format: currency_full

  revenue_trend:
    type: bar
    query: monthly_status_breakdown
    title: Monthly Net Sales by Status
    notes: >
      Monthly net sales for the selected region and time range, stacked by
      order status. Replaces the old separate status-split chart, which
      collapsed to a single status once the time range narrowed enough.
    x: month
    y: net_sales
    color: status
    link: *net_item_sales_amount_link
    style:
      orientation: vertical
      stack: zero
      title:
        # dbt_summit_theme sets the board title (Bugrino); chart-card titles
        # always inherit that same family from the engine, so pin the body
        # sans here per-chart to keep chart titles on Inter.
        font:
          family: '''Inter Variable'', Inter, system-ui, sans-serif'
      axis_y:
        labels:
          format: "$,.3~s"

  region_split:
    type: bar
    query: region_breakdown
    title: Net Sales by Region
    notes: Net sales split by customer region across all orders and all time, unaffected by the region and time range filters.
    x: region
    y: net_sales
    link: *net_item_sales_amount_link
    style:
      orientation: horizontal
      title:
        font:
          family: '''Inter Variable'', Inter, system-ui, sans-serif'
      axis_y:
        labels:
          format: "$,.3~s"

  country_sales_map:
    type: map
    query: country_breakdown
    title: Net Sales by Country
    notes: >
      World map of net sales by customer nation, filtered by region and time
      range (unlike region_split above, which stays an unfiltered baseline).
      lookup joins country_code (ISO-3166-1 numeric) to the world-countries
      geo source. Colors by sales_quantile_label (5 net-sales quintiles,
      categorical) rather than a continuous scale on net_sales, since this
      data is evenly distributed and washes out on a continuous ramp --
      quantile buckets give real visual separation, and the legend reads
      each bucket's actual dollar range. GeoshapeChartStyle.color rejects a
      `categorical:` style arm (confirmed by ERR-EXTRA-FIELD on
      style.color.categorical), so this falls back to the theme's default
      categorical palette rather than an ordered white-to-orange ramp --
      colors distinguish buckets but don't read as low-to-high intensity.
      The link: below still points at the real net_item_sales_amount metric.
    geo_source: world-countries
    lookup: country_code
    color: sales_quantile_label
    link: *net_item_sales_amount_link
    style:
      title:
        font:
          family: '''Inter Variable'', Inter, system-ui, sans-serif'
