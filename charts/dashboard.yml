title: "Order Performance"
notes: >
  TPC-H order KPIs, trend, and breakdowns by status and region. The region
  filter (from charts/meta.yml) narrows the KPI row, trend, and status split
  together; the region breakdown at the bottom stays constant as the
  all-regions baseline.

rows:
  - cols:
      - revenue_kpi
      - orders_kpi
      - aov_kpi
      - text: "🔗 [Data Health](https://pp569.metadata.eu1.dbt.com/exposure-tile?uniqueId=exposure.stephans_snow_sandbox.order_performance&environmentType=staging&environmentId=6605&token={{ tile_token }})"
        notes: >
          dbt Catalog's live freshness/health tile for this dashboard's own
          exposure (order_performance, models/viz/exposures.yml). tile_token
          (charts/meta.yml) is never given a real default; pass it at
          render/serve time (?tile_token=<token> on this URL, or dct render
          --var tile_token=<token>). See AGENTS.md.
  - cols:
      - width: "60%"
        rows: [revenue_trend]
      - rows: [status_split]
  - region_split
