title: "Order Performance"
notes: >
  TPC-H order KPIs, trend, and breakdowns by status and region. The region
  filter (from charts/meta.yml) narrows the KPI row, trend, and status split
  together; the region breakdown at the bottom stays constant as the
  all-regions baseline.

  The Data Health row links out to dbt's Explorer health tile
  (https://docs.getdbt.com/docs/explore/data-tile) for the order_performance
  exposure. A true *embed* was prototyped and ruled out: dbt charts strips
  `<iframe>`/`<script>`/`<object>`/`<embed>` tags from `text:` blocks even
  with `html_policy: trusted-raw` (confirmed empirically — only inline
  styling tags and `<img>` survive), so the health tile's iframe snippet
  can never render inside a board. Linking to it is the working fallback.
  Once `charts/dbt_cloud.yml`'s account_id/project_id/environment_id are
  filled in, replace `<TODO>` below with the real values (same convention
  as the semantic-definition links further down this board).

rows:
