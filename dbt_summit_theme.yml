# Theme: dbt_summit
# On-brand palette for presenting these boards at dbt Summit — dbt orange
# accent on a black canvas, warm off-white ink. Extends `stark` (not
# `clarity`) so every color/font below is set explicitly rather than
# inherited from clarity's steel-blue/serif editorial voice.
#
# Dark-canvas notes: `stark`'s own gray/border tokens assume a white board,
# so every ink/border/grid value below is repointed for contrast against
# black rather than just reused. The categorical palette's charcoal and
# muted-rose swatches from the light build are re-lightened here — a dark
# swatch on a black canvas is invisible, not just low-contrast.

extends: stark
style:
  background: "#000000"
  # Muted secondary-TEXT color (KPI support rows, table/spark subtitles) --
  # not a background/surface token despite the name. Was set to #151517
  # (near-black), which is illegible as text against this theme's black
  # canvas; matches the warm gray already used for axis/legend/kpi-label
  # text elsewhere in this file.
  muted: "#9A948A"
  accent: "#FF694A"          # dbt orange

  font:
    family: &font_sans '''Inter Variable'', Inter, system-ui, sans-serif'
    color: &color_ink "#F5F1EC"          # warm off-white

  border:
    color: "#2E2B28"

  title:
    # dbt Summit's own display face, falling back to the body sans if Bugrino
    # isn't installed/embeddable (no @font-face support in the render
    # pipeline today; see dct docs errors ERR-FORMAT-CONVERSION-FAILED).
    #
    # Only takes effect on a "prose" board (>=100 words of board-level text —
    # see dct's board_is_prose/title_font_family): a dashboard-style board's
    # page title always renders in the body font regardless of this setting.
    # charts/dashboard.yml is a dashboard, so today this only reaches a
    # future narrative-report board built on this theme; per-chart card
    # titles are pinned back to the body sans in charts/meta.yml so they
    # don't pick this up at medium/wide card widths.
    font:
      family: &font_display '''Bugrino'', ''Inter Variable'', Inter, system-ui, sans-serif'
      color: *color_ink
    subtitle:
      font:
        color: "#9A948A"

  charts:
    # On-chart annotations — direct value/endpoint labels drawn on marks
    # (bar/line/point labels) — read a monospace face, distinct from titles
    # and axis/legend chrome.
    marks:
      text:
        font:
          family: &font_mono '''IBM Plex Mono'', ''SFMono-Regular'', Menlo, Consolas, monospace'
          color: *color_ink

    color:
      categorical:
        # Re-lightened from the light-canvas build: a dark swatch (the old
        # charcoal/muted-rose) reads as invisible, not just low-contrast,
        # against a black canvas.
        palette:
          - "#FF694A"   # dbt orange (primary)
          - "#F5F1EC"   # off-white (was charcoal)
          - "#5FBF8F"   # green (brightened)
          - "#F2C14E"   # gold (brightened)
          - "#8CA0C4"   # slate blue (brightened)
          - "#E38080"   # rose (brightened)
        single_series_palette: ["#FF694A"]

    axis:
      line:
        color: "#3A3630"
      ticks:
        color: "#3A3630"
      grid:
        color: "#201E1B"
      labels:
        font:
          color: "#9A948A"
      title:
        font:
          color: "#9A948A"

    legend:
      label:
        font:
          color: "#9A948A"
      title:
        font:
          color: *color_ink

    kpi:
      value:
        font:
          color: *color_ink
      label:
        font:
          color: "#9A948A"

    tooltip:
      # Lifted a step off pure black so the tooltip still reads as a
      # distinct panel rather than blending into the canvas.
      background: "#1C1B19"
      label:
        font:
          color: "#B8B2A8"
      value:
        font:
          color: "#FFFFFF"
      border:
        color: "#FF694A"

  # Variable strip (Region / Time Range controls). Unset here, this falls
  # back to stark's own gray ink token — near-invisible against black.
  variables:
    font:
      color: *color_ink
    border:
      color: "#3A3630"
